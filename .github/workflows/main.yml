name: Builds, tests & docs

on:
  push:
  pull_request:

permissions: read-all

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Build package
        run: pnpm build

      - name: Build documentation
        run: pnpm docs:build

      - name: Run tests
        run: pnpm test
